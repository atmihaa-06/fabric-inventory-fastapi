<!DOCTYPE html>
<html>
<head>
    <title>Fabric Inventory Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Top Fabric Border -->
    <div class="top-banner"></div>

    <!-- Full Screen Sliding Fabric Background -->
    <div class="carousel-background">

        <div class="carousel-track">

            <img src="/static/cotton.jpg">
            <img src="/static/denim.jpg">
            <img src="/static/linen.jpg">
            <img src="/static/silk.jpg">
            <img src="/static/kalamkari.jpg">

            <!-- Duplicate Images for Infinite Loop -->
            <img src="/static/cotton.jpg">
            <img src="/static/denim.jpg">
            <img src="/static/linen.jpg">
            <img src="/static/silk.jpg">
            <img src="/static/kalamkari.jpg">

        </div>

    </div>

    <!-- Login Card -->
    <div class="main-content">

        <div class="login-container">

            <h1>Textile Inventory</h1>

            <p class="subtitle">
                Fabric & Material Management System
            </p>

            <form method="post" action="/login">

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text"
                        name="username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input
                        type="password"
                        name="password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

    <!-- Bottom Fabric Border -->
    <div class="bottom-banner"></div>

</body>
</html>
