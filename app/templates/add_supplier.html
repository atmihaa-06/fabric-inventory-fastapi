
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Supplier | Fabric Inventory</title>
    <link rel="stylesheet" href="/static/supplier-forms.css">
</head>
<body>

<main class="page">
    <section class="form-card">

        <div class="heading">
            <span class="eyebrow">SUPPLIER MANAGEMENT</span>
            <h1>Add New Supplier</h1>
            <p>Register a supplier to manage your fabric purchases.</p>
        </div>

        <form action="/add-supplier" method="post">
            <div class="form-grid">

                <div class="form-group">
                    <label for="supplier_name">Supplier Name *</label>
                    <input type="text" id="supplier_name" name="supplier_name"
                           placeholder="Enter supplier name" required>
                </div>

                <div class="form-group">
                    <label for="contact_person">Contact Person</label>
                    <input type="text" id="contact_person" name="contact_person"
                           placeholder="Enter contact person's name">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter phone number">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="supplier@example.com">
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3"
                              placeholder="Enter supplier address"></textarea>
                </div>

            </div>

            <button type="submit" class="submit-btn">Save Supplier</button>
        </form>

        <a href="/view-suppliers" class="back-link">
            ← Back to Suppliers
        </a>

    </section>
</main>

</body>
</html>
