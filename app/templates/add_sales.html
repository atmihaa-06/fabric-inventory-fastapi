<!DOCTYPE html>
<html>
<head>
    <title>Add Sales Order</title>
</head>
<body>

<h1>Add Sales Order</h1>

<form method="post">

    <label>Customer Name:</label><br>
    <input type="text" name="customer_name" required><br><br>

    <label>Fabric Name:</label><br>
    <input type="text" name="fabric_name" required><br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity" required><br><br>

    <label>Selling Price:</label><br>
    <input type="number" step="0.01" name="selling_price" required><br><br>

    <label>Order Date:</label><br>
    <input type="date" name="order_date" required><br><br>

    <button type="submit">Add Sales Order</button>

</form>

<br>

<a href="/view-sales">
    <button>Back</button>
</a>

</body>
</html>
