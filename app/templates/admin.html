<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<div class="container">

    <div class="header">

    <div class="title-section">
        <h1>Admin Dashboard</h1>
    </div>

    <div class="user-box">
        <span>Welcome, {{username}}</span>

        <a href="/logout">
            <button class="logout-btn">Logout</button>
        </a>
    </div>

</div>

    <div class="cards">

        <div class="card">
            <h2>Inventory</h2>
            <ul>
                <li>
    <a href="/view-fabrics">View All Fabrics</a>
</li>
                <li>
    <a href="/add-fabric">Add Fabric</a>
</li>
                <li>
    <a href="/view-fabrics">Update Fabric</a>
</li>
                <li>
    <a href="/view-fabrics">Delete Fabric</a>
</li>
                <li>
    <a href="/view-fabrics">
        Update Stock
    </a>
</li>
            </ul>
        </div>

        <div class="card">
    <h2>Sales Module</h2>

    <ul>

        <li>
            <a href="/view-sales">
                View Sales Orders
            </a>
        </li>

        <li>
            <a href="/sales-report">
                Sales Reports
            </a>
        </li>

    </ul>
</div>

        <div class="card">
            <h2>Purchase Module</h2>
            <ul>
                <li>
    <a href="/view-suppliers">
        Supplier Management
    </a>
</li>
                <li>
    <a href="/view-purchases">
        Purchase Records
    </a>
</li>
            </ul>
        </div>

        <div class="card">

    <h2>Material Register Upload</h2>

    <form
    action="/materials/upload-excel"
    method="post"
    enctype="multipart/form-data"
>

        <input
            type="file"
            name="file"
            accept=".xlsx,.xls"
            required
        >

        <button type="submit">
            Upload Excel
        </button>

    </form>
    

</div>

    </div>

</div>

</body>
</html>-
