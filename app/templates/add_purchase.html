
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Purchase Record | Fabric Inventory</title>

    <link rel="stylesheet" href="/static/add_purchase.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 18px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fce7f3, #fff7fb, #fdf2f8);
            color: #351326;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            width: 100%;
            max-width: 650px;
            margin: auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #b20d54;
            background: #fff;
            border: 1px solid #f4c5da;
            border-radius: 12px;
            padding: 11px 16px;
            font-weight: 700;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .back-btn:hover {
            background: #fce7f3;
            transform: translateY(-1px);
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading .icon {
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: #fce7f3;
            font-size: 30px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(26px, 4vw, 34px);
            color: #a30d4d;
        }

        .heading p {
            margin: 0;
            color: #866477;
            line-height: 1.6;
            font-size: 15px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #f5d2e2;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(153, 25, 83, 0.09);
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: 700;
            font-size: 14px;
            color: #4a1934;
        }

        input {
            width: 100%;
            min-height: 49px;
            padding: 12px 14px;
            border: 1px solid #edc3d7;
            border-radius: 11px;
            background: #fffafd;
            color: #351326;
            font: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #c2185b;
            box-shadow: 0 0 0 3px rgba(194, 24, 91, 0.10);
        }

        .submit-btn {
            width: 100%;
            min-height: 51px;
            margin-top: 4px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #c2185b, #a90f50);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(194, 24, 91, 0.22);
        }

        .note {
            margin: 18px 0 0;
            text-align: center;
            color: #8d6a7d;
            font-size: 12px;
            line-height: 1.5;
        }
        .heading {
    text-align: center;
    width: 100%;
    margin: 0 auto 25px;
}

.heading h1 {
    text-align: center;
    margin: 0 auto 10px;
}

.heading p {
    text-align: center;
    margin: 0 auto;
}

        @media (max-width: 480px) {
            body {
                padding: 22px 13px;
            }

            .form-card {
                padding: 22px 18px;
                border-radius: 18px;
            }

            .top-bar {
                margin-bottom: 18px;
            }

            .back-btn {
                padding: 10px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="top-bar">
            <a class="back-btn"
               href="{% if role_id == 1 %}/admin{% elif role_id == 2 %}/sales{% elif role_id == 3 %}/purchase{% else %}/login{% endif %}">
                &#8592; Back to Dashboard
            </a>
        </div>

        <header class="heading">
            <div class="icon">&#129534;</div>
            <h1>Add Purchase Record</h1>
            <p>Record a fabric purchase and update your inventory.</p>
        </header>

        <section class="form-card">
            <form action="/add-purchase" method="post">

                <div class="form-group">
                    <label for="supplier_name">Supplier Name</label>
                    <input
                        type="text"
                        id="supplier_name"
                        name="supplier_name"
                        placeholder="Enter supplier name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="fabric_name">Fabric Name</label>
                    <input
                        type="text"
                        id="fabric_name"
                        name="fabric_name"
                        placeholder="Enter an existing fabric name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity (meters)</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        step="1"
                        placeholder="Enter quantity"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="purchase_price">Purchase Price (₹)</label>
                    <input
                        type="number"
                        id="purchase_price"
                        name="purchase_price"
                        min="0"
                        step="0.01"
                        placeholder="Enter purchase price"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="purchase_date">Purchase Date</label>
                    <input
                        type="date"
                        id="purchase_date"
                        name="purchase_date"
                        required
                    >
                </div>

                <button class="submit-btn" type="submit">
                    Add Purchase Record
                </button>

            </form>

            <p class="note">
                Make sure the fabric name matches an existing fabric in your inventory.
            </p>
        </section>

    </main>
</body>
</html>
