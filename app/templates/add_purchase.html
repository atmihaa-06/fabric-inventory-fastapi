<!DOCTYPE html>
<html>
<head>
    <title>Add Purchase Record</title>
</head>
<body>

<h1>Add Purchase Record</h1>

<form action="/add-purchase" method="post">

    <label>Supplier Name</label><br>
    <input type="text" name="supplier_name" required>
    <br><br>

    <label>Fabric Name</label><br>
    <input type="text" name="fabric_name" required>
    <br><br>

    <label>Quantity</label><br>
    <input type="number" name="quantity" required>
    <br><br>

    <label>Purchase Price</label><br>
    <input type="number" step="0.01" name="purchase_price" required>
    <br><br>

    <label>Purchase Date</label><br>
    <input type="date" name="purchase_date" required>
    <br><br>

    <button type="submit">
        Add Purchase Record
    </button>

</form>

</body>
</html>
