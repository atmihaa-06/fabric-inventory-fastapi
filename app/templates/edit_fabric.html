<!DOCTYPE html>
<html>
<head>
    <title>Edit Fabric</title>
</head>

<body>

<h1>Edit Fabric</h1>

<form action="/edit-fabric/{{ fabric.id }}" method="post">

    <p>
        Fabric Name<br>
        <input type="text"
               name="fabric_name"
               value="{{ fabric.fabric_name }}"
               required>
    </p>

    <p>
        Fabric Type<br>
        <input type="text"
               name="fabric_type"
               value="{{ fabric.fabric_type }}"
               required>
    </p>

    <p>
        Color<br>
        <input type="text"
               name="color"
               value="{{ fabric.color }}">
    </p>

    <p>
        GSM<br>
        <input type="number"
               step="0.01"
               name="gsm"
               value="{{ fabric.gsm }}"
               required>
    </p>

    <p>
        Price Per Meter<br>
        <input type="number"
               step="0.01"
               name="price_per_meter"
               value="{{ fabric.price_per_meter }}"
               required>
    </p>

    <p>
        Available Stock<br>
        <input type="number"
               name="available_stock"
               value="{{ fabric.available_stock }}"
               required>
    </p>

    <p>
        Supplier Name<br>
        <input type="text"
               name="supplier_name"
               value="{{ fabric.supplier_name }}">
    </p>

    <button type="submit">
        Update Fabric
    </button>

</form>

<br>

<a href="/view-fabrics">
    <button>Back</button>
</a>

</body>
</html>
